<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>הזמנה - פייפר קאפס</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial;background:#0f0f1a;color:#f0ead6;margin:0;padding:0 0 100px;-webkit-text-size-adjust:100%}header{position:sticky;top:0;background:#16213e;padding:18px;text-align:center;border-bottom:2px solid #c9a84c}h1{margin:0;font-size:24px}.wrap{padding:10px}.row{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;background:#16213e;border:1px solid #2a3f60;border-radius:10px;padding:9px 12px;margin-bottom:7px;direction:rtl}.row span{flex:1;text-align:right;direction:rtl}.q{display:flex;direction:rtl;flex:0 0 auto;border:1px solid #2a3f60;border-radius:8px;overflow:hidden}button,input{width:36px;height:34px;border:0;background:#0f0f1a;color:#f0ead6;text-align:center;font-size:16px}button{color:#c9a84c;font-size:20px}textarea{width:100%;box-sizing:border-box;min-height:70px;background:#16213e;color:#fff;border:1px solid #2a3f60;border-radius:10px;padding:10px}.warn{text-align:center;color:#e8c97a;font-weight:700;margin:12px 0}footer{position:fixed;bottom:0;left:0;right:0;background:#0f0f1a;border-top:2px solid #c9a84c;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center}.send{width:auto;padding:0 18px;background:#25D366;color:#fff;border-radius:10px;font-weight:700}</style></head><body><header><div>✦ הזמנה ✦</div><h1>פייפר קאפס</h1></header><div class="wrap" id="products"></div><div class="wrap"><textarea id="notes" placeholder="הערות להזמנה..."></textarea><div class="warn">‼️ דווח חוסרים בהקדם האפשרי ‼️</div></div><footer><div><b id="count">0</b> פריטים</div><button class="send" onclick="sendOrder()">שלח הזמנה</button></footer><script>const PHONE='972544274897',RLM='\u200F',LRM='\u200E',RLE='\u202B',PDF='\u202C';const PRODUCTS=['המבורגר צדפה לבן','ביו חצי חום חורים','ביו 1 שחור חורים','ביו 1 חום חורים','ביו 2 חום חורים','ביו 3 חום חורים','מטוגנים קטן חום','מטוגנים גדול חום','קינג ג׳ורג׳ לבן חורים','קינג ג׳ורג׳ חום חורים','קינג ג׳ורג׳ שחור חורים','תחתית להמבורגר','גלידה 3 כדורים','מכסה גלידה','מכסה כוס 9 שחור','מפיות 40/40','‼️*לידע נהג לקח החזרות*‼️'];const wrap=document.getElementById('products');PRODUCTS.forEach(p=>{const r=document.createElement('div');r.className='row';r.innerHTML='<span></span><div class="q"><button onclick="chg(this,-1)">−</button><input type="number" min="0" value="0" inputmode="numeric"><button onclick="chg(this,1)">+</button></div>';r.querySelector('span').textContent=p;r.querySelector('input').oninput=refresh;wrap.appendChild(r)});function chg(btn,d){const i=btn.parentElement.querySelector('input');i.value=Math.max(0,(parseInt(i.value)||0)+d);refresh()}function refresh(){let t=0;document.querySelectorAll('.row input').forEach(i=>t+=parseInt(i.value)||0);count.textContent=t}function orderLine(name,q){return RLM+'• '+name+RLM+': '+LRM+'*'+q+'*'+RLM}function sendOrder(){const lines=['🛒 *הזמנה - פייפר קאפס*','📅 '+new Date().toLocaleDateString('he-IL'),'─────────────────'];let total=0;document.querySelectorAll('.row').forEach(r=>{const q=parseInt(r.querySelector('input').value)||0;if(q>0){lines.push(orderLine(r.querySelector('span').textContent,q));total+=q}});if(!total){alert('לא נבחרו פריטים');return}const n=notes.value.trim();if(n)lines.push('','📝 *הערות:* '+n);lines.push('','─────────────────','✅ סה״כ: *'+total+' פריטים*','','‼️ *דווח חוסרים בהקדם האפשרי* ‼️','','*אשרי*');const msg=lines.map(x=>RLM+RLE+x+PDF+RLM).join('\n');location.href='https://wa.me/'+PHONE+'?text='+encodeURIComponent(msg)}</script></body></html>
